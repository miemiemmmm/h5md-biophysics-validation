# Python environment for the validation scripts (conda / mamba / micromamba):
#   micromamba create -f environment.yml
# Tested with Python 3.12, h5py 3.16, numpy 1.26 and 2.5, matplotlib 3.11 and
# scipy 1.17-1.18. Validation 6 also needs pytraj (part of AmberTools), which is
# not listed here; without it Validation 6 is skipped.
name: h5md-validation
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - h5py>=3.0
  - numpy>=1.20
  - matplotlib    # Validation 5 figure
  - scipy         # scripts/fit_write_time.py
  - pip
  - pip:
      # The validator maintained with the specification (Validations 1, 3 and 4),
      # pinned to the specification version in docs/target_specification.md.
      - h5md-biophysics-validator @ git+https://gitlab.com/gromacs/h5md-biophysics.git@v1.0.0-alpha.1#subdirectory=validator
